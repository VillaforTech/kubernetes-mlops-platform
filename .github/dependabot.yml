version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: America/Guayaquil
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    groups:
      actions-maintenance:
        patterns: ['*']
        update-types: [minor, patch]
