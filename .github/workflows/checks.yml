name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install pytest==8.4.2 httpx==0.28.1 ruff==0.12.12
      - name: Install kubectl
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://dl.k8s.io/release/v1.33.12/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v1.33.12/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make check
      - name: Validate infrastructure tooling
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.local/ansible-collections
        run: |
          python -m venv .local/infra-venv
          .local/infra-venv/bin/python -m pip install -r infra/requirements.txt
          .local/infra-venv/bin/python -m pip check
          .local/infra-venv/bin/python -c "import openstack.connection"
          for attempt in 1 2 3; do
            .local/infra-venv/bin/ansible-galaxy collection install \
              -r infra/ansible/collections.yml -p "$ANSIBLE_COLLECTIONS_PATH" --timeout 30 && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
          .local/infra-venv/bin/ansible-doc -t module openstack.cloud.server > /dev/null
          .local/infra-venv/bin/ansible-playbook --syntax-check -i localhost, infra/ansible/provision.yml
          .local/infra-venv/bin/ansible-playbook --syntax-check -i infra/ansible/inventory.ini.example infra/ansible/configure.yml
