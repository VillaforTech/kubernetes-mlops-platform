name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install pytest==8.4.2 httpx==0.28.1 ruff==0.12.12
      - name: Install kubectl
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://dl.k8s.io/release/v1.33.12/bin/linux/amd64/kubectl
          curl -fsSLO https://dl.k8s.io/release/v1.33.12/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check --status
          chmod +x kubectl
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make check
