apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mlops
resources:
- namespace.yaml
- postgres.yaml
- minio.yaml
- mlflow.yaml
- predictor.yaml
- prometheus.yaml
- grafana.yaml
- evidently.yaml
configMapGenerator:
- name: prometheus-config
  files:
  - prometheus.yml=config/prometheus.yml
- name: grafana-datasource
  files:
  - datasource.yml=config/datasource.yml
- name: grafana-provider
  files:
  - provider.yml=config/provider.yml
- name: grafana-dashboard
  files:
  - platform.json=config/dashboard.json
