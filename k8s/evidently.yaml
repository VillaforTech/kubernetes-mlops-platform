apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evidently-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidently
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: evidently
  template:
    metadata:
      labels:
        app: evidently
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: evidently
        image: mlops-platform:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: workspace
          mountPath: /workspace
        command:
        - evidently
        args:
        - ui
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --workspace
        - /workspace
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      volumes:
      - name: tmp
        emptyDir: {}
      - name: workspace
        persistentVolumeClaim:
          claimName: evidently-data
---
apiVersion: v1
kind: Service
metadata:
  name: evidently
spec:
  selector:
    app: evidently
  ports:
  - name: http
    port: 8000
    targetPort: 8000
